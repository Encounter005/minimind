# MiniModel small-smoke：验证 src/minimind 的训练闭环（约 2.08M 参数 / 500 iter）
# 用法（仓库根目录）：
#   .venv/bin/python -m my_trainer.bench  configs/minimind_smoke.toml
#   .venv/bin/python -m my_trainer.train  configs/minimind_smoke.toml
#   .venv/bin/python -m my_trainer.sample configs/minimind_smoke.toml

[data]
name = "minimind_smoke"     # dataset/minimind_smoke/{train,val}.bin
root = "dataset"
reader = "memmap"
tokenizer = "hf:model"      # 仓库自带的 6400 词表（model/tokenizer.json）
batch_size = 8
block_size = 256

[model]
name = "minimind"
location = "src/minimind/trainer_plugin.py"
block_size = 256
n_layer = 2
n_head = 4
n_embd = 128
bias = false                # MiniMind 全部投影不带 bias，此字段被适配器忽略

[model.extras]
n_kv_head = 2               # GQA：4 个 query head 共用 2 个 kv head
rope_theta = 1.0e6

[optim]
lr = 5.0e-4
min_lr = 5.0e-5
weight_decay = 0.1
grad_clip = 1.0
warmup_iters = 20
lr_decay_iters = 500

[train]
max_iters = 500
grad_accum = 2
amp = "bf16"
eval_interval = 50
eval_iters = 10
log_interval = 10
seed = 1337

[run]
name = "minimind_smoke"
resume = "auto"
save_interval = 250

[log]
console = true
progress = true
file = true
tensorboard = false

[sample]
prompt = "给我生成一首有关秋天的诗歌。"
max_new_tokens = 100
temperature = 0.8
top_k = 40
